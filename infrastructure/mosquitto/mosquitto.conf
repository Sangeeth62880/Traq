# TRAQ Mosquitto MQTT Broker Configuration
# ===========================================

# MQTT listener (for ESP32 nodes and backend)
listener 1883
protocol mqtt

# WebSocket listener (for browser-based dashboard)
listener 9001
protocol websockets

# Authentication
allow_anonymous false
password_file /mosquitto/config/passwd

# Logging
log_type all
log_dest file /mosquitto/log/mosquitto.log

# Persistence
persistence true
persistence_location /mosquitto/data/
